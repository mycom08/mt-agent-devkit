name: Release

# Manual-only. `main` always carries an `x.y.z-SNAPSHOT` VERSION; this job strips
# the suffix, stamps and tags the release, then bumps forward to the next snapshot.
# Minor/major releases are cut by hand-editing VERSION (and the matching CHANGELOG
# heading) on main before running this job — the bump-forward step is patch-only.
#
# Requires repository secret RELEASE_TOKEN — a PAT (or app token) with `contents:
# write` that is allowed to push to main. The default GITHUB_TOKEN is not assumed
# to be able to push to a protected branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Job 1: validate, stamp, tag, release ───────────────────────────────────
  release:
    name: Validate and tag release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Guard: main only. A step that exits 1 (rather than a job-level `if`)
      # so a dispatch from any other ref fails visibly instead of being skipped.
      - name: Guard — must run on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "ERROR: Release must be triggered from main (current ref: ${{ github.ref }})"
          exit 1

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # VERSION must be a snapshot; the release version is that value minus the suffix.
      - name: Read and validate VERSION
        id: version
        run: |
          SNAPSHOT=$(tr -d '[:space:]' < VERSION)
          if ! echo "${SNAPSHOT}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$'; then
            echo "ERROR: VERSION '${SNAPSHOT}' is not a snapshot version (expected x.y.z-SNAPSHOT)."
            exit 1
          fi
          VERSION="${SNAPSHOT%-SNAPSHOT}"
          echo "snapshot=${SNAPSHOT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION} (from ${SNAPSHOT})"

      - name: Check tag does not exist
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "ERROR: Tag ${TAG} already exists on origin. Aborting."
            exit 1
          fi

      - name: Validate CHANGELOG heading exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no section heading for [${VERSION}]."
            exit 1
          fi

      # "- " (dash + space) so a `---` section separator is not mistaken for a bullet.
      - name: Validate CHANGELOG section is not empty
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SECTION=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          ENTRIES=$(echo "${SECTION}" | grep -cE '^[[:space:]]*- ' || true)
          if [ "${ENTRIES}" -eq 0 ]; then
            echo "ERROR: CHANGELOG.md section [${VERSION}] has no entries under ### Changes or ### Bug Fixes."
            exit 1
          fi

      # One commit: clean VERSION + dated CHANGELOG heading + renamed changes.json key.
      - name: Stamp release and commit
        id: stamp
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SNAPSHOT="${{ steps.version.outputs.snapshot }}"
          RELEASE_DATE=$(date -u +%Y-%m-%d)

          echo "${VERSION}" > VERSION
          sed -i "s/^## \[${VERSION}\] - Unreleased/## [${VERSION}] - ${RELEASE_DATE}/" CHANGELOG.md
          sed -i "0,/\"${SNAPSHOT}\":/s//\"${VERSION}\":/" changes.json
          python3 -c "import json; json.load(open('changes.json'))"

          git add VERSION CHANGELOG.md changes.json
          git commit -m "chore(release): release v${VERSION} [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            --target "${{ steps.stamp.outputs.sha }}" \
            --title "v${VERSION}" \
            --notes "Release v${VERSION}. See CHANGELOG.md for details."

  # ── Job 2: bump main forward to the next snapshot ──────────────────────────
  post-release:
    name: Bump to next snapshot
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next snapshot version
        id: next
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          MAJOR=$(echo "${VERSION}" | cut -d. -f1)
          MINOR=$(echo "${VERSION}" | cut -d. -f2)
          PATCH=$(echo "${VERSION}" | cut -d. -f3)
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "next_version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "next_snapshot=${NEXT}-SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Open next version in VERSION, CHANGELOG and changes.json
        run: |
          NEXT="${{ steps.next.outputs.next_version }}"
          NEXT_SNAPSHOT="${{ steps.next.outputs.next_snapshot }}"

          echo "${NEXT_SNAPSHOT}" > VERSION

          awk -v next_ver="${NEXT}" '
            /^## \[/ && !inserted {
              printf "## [%s] - Unreleased\n\n### Changes\n\n### Bug Fixes\n\n---\n\n", next_ver
              inserted=1
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

          awk -v key="${NEXT_SNAPSHOT}" '
            NR==1 {
              print
              printf "  \"%s\": {\n    \"new\": [],\n    \"modified\": [],\n    \"removed\": [],\n    \"descriptions\": {}\n  },\n", key
              next
            }
            { print }
          ' changes.json > changes.json.tmp
          mv changes.json.tmp changes.json
          python3 -c "import json; json.load(open('changes.json'))"

      - name: Commit and push snapshot bump
        run: |
          git add VERSION CHANGELOG.md changes.json
          git commit -m "chore(release): open ${{ steps.next.outputs.next_snapshot }} [skip ci]"
          git push origin HEAD:main
