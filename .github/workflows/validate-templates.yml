name: Validate Templates

on:
  push:
    branches:
      - ci-validation
  pull_request:
    paths:
      - ".claude/agents/templates/**"
      - ".claude/agents/workflows/**"
      # The gate script and this workflow must trigger their own gate. Without
      # these, a PR editing only validate_templates.py runs no check at all, and
      # `gh pr checks` reporting nothing satisfies the merge gate by default.
      - "scripts/**"
      - ".github/workflows/validate-templates.yml"

jobs:
  layer1-validate:
    name: Layer-1 invariant check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run validate_templates.py
        run: python scripts/validate_templates.py
